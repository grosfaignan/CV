profile:
  lede: {fr: "En reconversion vers le support et l’exploitation informatique, avec l’administration de systèmes Linux pour horizon.", en: "Moving into IT support and operations, with Linux system administration as my long-term goal."}
  cards:
    - tag: {fr: Actuellement, en: Currently}
      text: {fr: "Progression sur Qubes OS, Fedora secureblue, Terraform / OpenTofu, Grafana, Prometheus, Loki et la recherche agentique (Hermes, LangGraph). Reprise d’études au CNAM en réseau, sécurité informatique et mathématiques.", en: "Building skills in Qubes OS, Fedora secureblue, Terraform / OpenTofu, Grafana, Prometheus, Loki and agentic research (Hermes, LangGraph). Back in education at CNAM (French national school for continuing education) in networking, IT security and mathematics."}
    - tag: {fr: Pratique, en: Hands-on}
      text: {fr: "Configuration, automatisation et maintenance autodidactes de systèmes Linux et Windows. Workflows GitHub Actions de CI/CD. Interfaçage d’applications et de microservices par virtualisation (KVM, Docker). Manpages et assistance IA.", en: "Self-taught configuration, automation and maintenance of Linux and Windows systems. GitHub Actions CI/CD workflows. Connecting applications and microservices through virtualisation (KVM, Docker). Man pages and AI assistance."}
    - tag: {fr: Parcours, en: Background}
      text: {fr: "Plusieurs années d’expérience commerciale (prospection, négociation, gestion de portefeuille B2B), complétées par une pratique de l’analyse documentaire et de la veille technologique et concurrentielle.", en: "Several years of sales experience (prospecting, negotiation, B2B account management), along with practice in document analysis and technology and competitive intelligence."}
  goal: {fr: "Recherche une première expérience en support et exploitation informatique, ou en administration Linux junior.", en: "Looking for a first role in IT support and operations, or as a junior Linux administrator."}
  # Résumé utilisé par le PDF ATS, le Word, le Markdown et le JSON Resume
  summary: {fr: "En reconversion vers le support et l’exploitation informatique, avec l’administration de systèmes Linux pour horizon. Configuration, automatisation et maintenance autodidactes de systèmes Linux et Windows, workflows GitHub Actions de CI/CD, virtualisation (KVM, Docker). Plusieurs années d’expérience commerciale B2B, complétées par une pratique de l’analyse documentaire et de la veille technologique et concurrentielle. Recherche une première expérience en support et exploitation informatique, ou en administration Linux junior.", en: "Moving into IT support and operations, with Linux system administration as my long-term goal. Self-taught configuration, automation and maintenance of Linux and Windows systems, GitHub Actions CI/CD workflows, virtualisation (KVM, Docker). Several years of B2B sales experience, along with practice in document analysis and technology and competitive intelligence. Looking for a first role in IT support and operations, or as a junior Linux administrator."}

